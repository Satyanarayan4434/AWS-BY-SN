<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>

    <!-- Internal CSS -->
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .error-box {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 400px;
        }

        .error-box h1 {
            font-size: 72px;
            margin: 0;
            color: #dc3545;
        }

        .error-box h2 {
            margin: 10px 0;
            color: #333;
        }

        .error-box p {
            color: #666;
            margin-bottom: 20px;
        }

        .error-box a {
            text-decoration: none;
            background-color: #0a58ca;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }

        .error-box a:hover {
            background-color: #084298;
        }
    </style>
</head>

<body>

    <div class="error-box">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>
            Oops! The page you are looking for doesn’t exist or has been moved.
        </p>
        <a href="index.html">Go Back Home</a>
    </div>

</body>
</html>
